<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Milimo AfrEval — Certification & Security</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #0d1117; color: #e6edf3; }
      header { padding: 18px 24px; border-bottom: 1px solid #30363d; }
      header h1 { font-size: 18px; margin: 0; }
      main { max-width: 960px; margin: 0 auto; padding: 24px; }
      h2 { font-size: 15px; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #21262d; font-size: 13px; }
      th { color: #8b949e; font-weight: 600; }
      .pass { color: #3fb950; } .fail { color: #f85149; }
      .bar { background: #21262d; border-radius: 3px; height: 8px; width: 100%; }
      .bar > i { display: block; height: 8px; border-radius: 3px; background: #f85149; }
      .bar > i.zero { background: #3fb950; }
      code { font-family: ui-monospace, monospace; font-size: 12px; color: #79c0ff; }
    </style>
  </head>
  <body>
    <header><h1>Milimo AfrEval — Certification & Security</h1></header>
    <main>
      <h2>Certifications (Context Score)</h2>
      <table id="certs"><thead><tr><th>Model</th><th>Score</th><th>LF / CS / SE</th><th>Verdict</th><th>sha256</th></tr></thead><tbody></tbody></table>

      <h2>Security (per-seam bypass rate)</h2>
      <table id="seams"><thead><tr><th>Seam</th><th>Bypasses / total</th><th>Rate</th><th></th></tr></thead><tbody></tbody></table>
      <p id="security-meta"></p>

      <h2>Context Profile (per-language / per-script)</h2>
      <div id="profile"></div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
