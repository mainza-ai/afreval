scale:
  asr_hours: ~1250 transcribed (pin exact paper revision)
  tts_hours: "~180-235 (varies by paper revision \u2014 pin exact; TTS configs excluded\
    \ from harness)"
  note: the paper's '~10% of collected audio transcribed' describes pre-release collection;
    on the Hub the transcribed subset is train/val/test and the remainder ships as
    the unlabeled split
collection:
  method: image-prompted speech in natural environments
  min_clip_seconds: 15
  metadata: speaker age/gender/language/environment
  transcribed_by: paid local linguistic experts, local scripts where available
acquisition_strategy:
  stage_a: "Phase 0 (now): acquire validation + test only \u2014 the frozen WER/CER\
    \ eval harness (\xA73.4 'held-out eval split'); ~2% of the collection (~1-2 days)"
  stage_b: 'Phase 4 (deferred): acquire labeled train per language as the WAXAL-NET
    fine-tuning substrate, on-demand; still excludes unlabeled'
  never: unlabeled split (pretraining-only; AfrEval does not pretrain) and the full
    1,250h materialization
  default_splits:
  - validation
  - test
acquisition_records:
  status: QA-COMPLETE-AWAITING-APPROVAL
  date: 2026-07-31
  revision: e0a62aaebc61bd5bb8cac17a08d1b42c65551dd2
  configs_acquired: 19
  total_rows: 76107
  empty_transcriptions: 0
  audio_bytes: "~21 GB local (data/waxal/audio/ \u2014 not committed to git; re-pullable\
    \ from pinned revision)"
  raw_parquet_bytes: "~18 GB local (data/waxal/raw/ \u2014 not committed to git)"
  method: snapshot_download allow_patterns="data/ASR/*/*-{validation,test}-*.parquet"
    (never unlabeled/TTS/train)
  loader_caveat: "datasets.load_dataset() materializes the whole config incl. unlabeled\
    \ \u2014 do NOT use it for acquisition; the script reads local parquet via pyarrow"
qa_results:
  rows_qaed: 74400
  flagged_for_review: 2255
  review_artifact: data/waxal/qa2_review.md + qa2_drops.json (human approval required
    before drop)
  high_rate_configs:
    kpo_asr: 747
    lin_asr: 337
    tir_asr: 267
    wal_asr: 232
    mlg_asr: 173
  next: human reviews qa2_review.md -> finalize_waxal.py --apply (writes filtered
    manifests) -> freeze_checksums.py --pin waxal.yaml
qa_findings:
  conclusion: CORPUS IS VALID. WAXAL audio contains the transcribed speech. QA-BLOCKED
    lifted (2026-07-31).
  initial_false_alarm: "General ASRs (Whisper-ctranslate2, Whisper-MLX, Meta MMS)\
    \ catastrophically failed (degeneration/garbage) + spectrogram/'silence' analysis\
    \ suggested non-speech. WRONG interpretation \u2014 these are model-choice artifacts,\
    \ not corpus defects."
  decisive_evidence: "badrex/Ethio-ASR-multilingual-600M (wav2vec2-bert-2.0 fine-tuned\
    \ ON google/WaxalNLP, CTC, cannot loop) transcribes the same amh clip at WER 0.286-0.314\
    \ (correct sentence). Across amh/tir/orm/sid/wal validation clips: mean WER 0.18-0.46\
    \ \u2014 consistent with the model card's WAXAL test-set WERs (amh 22.9, tir 35.2,\
    \ orm 24.4, sid 31.7, wal 38.2)."
  why_general_asrs_fail: "WAXAL is spontaneous, natural-environment speech (image-prompted,\
    \ field recordings, quiet/sparse). Zero-shot foundation ASRs trained on clean\
    \ studio speech fail on it \u2014 this EMPIRICALLY REPRODUCES the WAXAL-NET thesis\
    \ (\xA72.1): fine-tuned/tuned models beat zero-shot foundations on spontaneous\
    \ African speech."
  correct_qa_asr: "Second-ASR pass must use WAXAL-tuned models: Ethio-ASR (badrex/Ethio-ASR-multilingual-600M)\
    \ for amh/tir/orm/sid/wal (open); Sunbird/asr-whisper-51-african-languages for\
    \ the other 14 (ach, aka, dag, dga, ewe, ful, kpo, lin, lug, mlg, nyn, sna, sog/xog,\
    \ tir...; GATED \u2014 requires HF login/token). mas likely uncovered by both."
  next_steps:
  - run full QA pass 2 with Ethio-ASR (5 langs, no token needed) + Sunbird (14 langs,
    needs HF token for gated model)
  - record per-language WER distributions + adaptive outlier flags
  - freeze after QA
qa_required:
  step1_pull_by_config: pull {lang}_asr configs, requested splits only; allow_patterns
    never match *-unlabeled-*
  step2_materialize: decode each clip; corrupt/unreadable audio raises and never enters
    the harness
  step3_empty_transcription_audit: verify empties are (near-)absent in labeled splits;
    filter only if >0.1% (don't assume)
  step4_qa_pass: "second-ASR edit distance is the REAL filter \u2014 flag/drop high-divergence\
    \ rows"
  step5_checksum_and_freeze: checksummed filtered corpus + provenance record in README
acquisition_script: scripts/acquire_waxal.py
