[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afreval-harness"
version = "0.1.0"
description = "Frozen, checksummed evaluation harness for Milimo AfrEval (Phase 0): WAXAL, AfroBench-LITE, afri-fertility"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "afri-fertility>=0.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
waxal = ["datasets>=2.20", "huggingface_hub>=0.24"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
