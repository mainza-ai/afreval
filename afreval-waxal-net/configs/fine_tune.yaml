# §3.4 fine-tune config — THE MUTABLE ARTIFACT. The agent edits this file.
# Device layer asserts hardware class: this must run on the TARGET edge class,
# not a workstation GPU, or the claim is invalid (§3.4).

model:
  base: mlx-community/whisper-large-v3-turbo   # edge-friendly seed (or compact-whisper)
  adapter: lora
  lora_rank: 16

train:
  batch_size: 8
  lr: 5.0e-05
  epochs: 3
  warmup_steps: 100
  grad_accum_steps: 4
  fp16: true

data:
  train_split: [train]
  max_audio_secs: 30
  language_weighting: balanced   # avoid overfitting high-resource languages

eval:
  metric: [wer, cer]
  ood_secondary: true
  # TARGET hardware class (gap-analysis B6, 2026-08-05) — numeric, not a label.
  # The device layer asserts this at run time and FAILS LOUD on mismatch.
  # Reference device: a low-end 2023-2025 Android/feature phone (the WAXAL-NET
  # collection target class). The bound below is the WORST case a run may
  # execute on; a run on anything faster invalidates the Phase-4 claim.
  hardware_class:
    name: low-end-mobile
    device: "low-end Android (e.g. 4GB RAM class, 2-4 Cortex-A7x-class cores, no NPU/GPU offload)"
    runtime_memory_mb_max: 4096        # peak RSS while running the exported model
    model_file_mb_max: 350             # exported ONNX/TFLite size cap for the edge artifact
    realtime_factor_max: 1.0           # RTF <= 1.0 on the reference device (audio longer than realtime fails)
    inference_footprint: "int8/FP16 quantized; no fp32 inference on-device"
    assertion: "fail-loud if the detected device exceeds these bounds (e.g. a workstation GPU or Apple-Silicon MLX run)"

export:
  format: [onnx, tflite]
