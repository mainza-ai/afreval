# Pinned API price snapshot — 2026-06-12
# All prices in USD per token (divide per-million price by 1,000,000).
# Prices are keyed by tokenizer ID; each entry represents the API tier that
# uses that tokenizer. Open-weight models have no canonical price — the entry
# records one representative hosting provider, named in the comment.
# Appendix C of the paper must list: provider, tier/model name, source URL,
# and access date for each entry.

snapshot_date: "2026-06-12"
currency: USD
models:

  openai/o200k_base:
    # Model:    GPT-4.1 (also covers GPT-4o, GPT-5, o3, o4-mini — all use o200k_base)
    # Tier:     GPT-4.1 standard input / output
    price_in:  0.0000025    # $2.50 per 1M input tokens
    price_out: 0.000010     # $10.00 per 1M output tokens

