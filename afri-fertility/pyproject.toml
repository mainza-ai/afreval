[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afri-fertility"
version = "0.1.0"
description = "Measure the tokenization tax on African languages across frontier LLMs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "DataLens Africa Research", email = "research@datalens.africa" },
]
keywords = ["nlp", "tokenization", "african-languages", "llm", "fertility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "tiktoken>=0.7",
  "transformers>=4.40",
  "tokenizers>=0.19",
  "datasets>=2.19",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "regex>=2024.4",
  "uniseg>=0.7",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
api = [
  "anthropic>=0.27",
  "google-generativeai>=0.5",
]
viz = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "matplotlib>=3.8",
]

[project.scripts]
afri-fertility = "afri_fertility.cli:app"

[project.urls]
Homepage = "https://datalens.africa"
Repository = "https://github.com/ciphersenseai/afri-fertility"
"Bug Tracker" = "https://github.com/ciphersenseai/afri-fertility/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/afri_fertility"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
